<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports Inventory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --navy: #16324F;
            --blue: #2A5C8A;
            --blue-light: #EAF1F8;
            --bg: #F4F6F9;
            --card: #FFFFFF;
            --border: #E2E8F0;
            --text: #1F2937;
            --muted: #64748B;
            --shadow: 0 1px 3px rgba(16, 32, 55, 0.05), 0 10px 30px rgba(16, 32, 55, 0.04);
            --radius: 12px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            background: linear-gradient(135deg, var(--navy), var(--blue));
            color: #fff;
            padding: 22px 28px;
            box-shadow: 0 2px 12px rgba(16, 32, 55, 0.18);
        }

        .topbar-inner {
            max-width: 95%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .topbar-inner h1 {
            font-family: 'Sora', sans-serif;
            font-size: 22px;
            margin: 0;
            font-weight: 700;
        }

        .topbar-inner p {
            margin: 4px 0 0;
            font-size: 13px;
            color: #CFE0F2;
            font-weight: 500;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.28);
            color: #fff;
            padding: 9px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 600;
            font-family: inherit;
            transition: var(--transition);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.22);
            transform: translateX(-2px);
        }

        .refresh-btn {
            background: var(--blue);
            border: 1px solid var(--blue);
            color: #fff;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 600;
            font-family: inherit;
            transition: var(--transition);
            box-shadow: var(--shadow);
            white-space: nowrap;
        }

        .refresh-btn:hover {
            background: var(--navy);
            border-color: var(--navy);
        }

        .toolbar {
            max-width: 95%;
            margin: 28px auto 0;
            padding: 0 28px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-wrap {
            position: relative;
            flex: 1;
            min-width: 280px;
        }

        .search-wrap svg {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            opacity: .45;
            color: var(--muted);
        }

        #searchInput {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--card);
            font-size: 14.5px;
            font-family: inherit;
            box-shadow: var(--shadow);
            outline: none;
            transition: var(--transition);
        }

        #searchInput:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(42, 92, 138, 0.15);
        }

        .container {
            max-width: 95%;
            margin: 0 auto;
            padding: 24px 28px 80px;
        }

        .status-banner {
            border-radius: 9px;
            padding: 12px 16px;
            font-size: 13.5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: #FEF2F2;
            border: 1px solid #F3B4B4;
            color: #991B1B;
        }

        /* Loading / Spinner State */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            gap: 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .spinner {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 4px solid var(--blue-light);
            border-top-color: var(--blue);
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-state p {
            color: var(--muted);
            font-size: 14.5px;
            font-weight: 500;
            margin: 0;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 24px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            color: var(--muted);
        }

        .empty-state svg {
            color: var(--border);
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-family: 'Sora', sans-serif;
            font-size: 17px;
            margin: 0 0 6px;
            color: var(--navy);
        }

        .empty-state p {
            font-size: 14px;
            margin: 0;
        }

        /* Collapsible Accordion Styles */
        .accordion-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 18px;
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: var(--transition);
        }

        .accordion-item:hover {
            box-shadow: 0 4px 20px rgba(16, 32, 55, 0.08);
        }

        .accordion-header {
            width: 100%;
            background: #FAFCFE;
            border-bottom: 1px solid transparent;
            padding: 16px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            text-align: left;
            user-select: none;
            transition: var(--transition);
            gap: 14px;
        }

        .accordion-header:hover {
            background-color: var(--blue-light);
        }

        .accordion-item.expanded .accordion-header {
            border-bottom-color: var(--border);
            background: #F1F6FB;
        }

        .accordion-title {
            font-family: 'Sora', sans-serif;
            font-size: 15.5px;
            font-weight: 700;
            color: var(--navy);
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .count-badge {
            background: var(--blue);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            min-width: 24px;
            text-align: center;
        }

        .folder-header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn-folder-export {
            background: #10847a;
            color: #ffffff;
            border: none;
            border-radius: 7px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .btn-folder-export:hover {
            background: #0d6e66;
            transform: translateY(-1px);
        }

        .btn-folder-refresh {
            background: #EFF6FF;
            color: #1D4ED8;
            border: 1px solid #BFDBFE;
            border-radius: 7px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: var(--transition);
            white-space: nowrap;
        }

        .btn-folder-refresh:hover {
            background: #DBEAFE;
        }

        .chevron {
            font-size: 13px;
            color: var(--muted);
            transition: transform 0.25s ease;
            display: inline-block;
            margin-left: 4px;
        }

        .accordion-item.expanded .chevron {
            transform: rotate(180deg);
        }

        .accordion-content {
            display: none;
            background-color: #FAFBFD;
        }

        .accordion-item.expanded .accordion-content {
            display: block;
        }

        /* Report Table / List Styles */
        .table-scroll-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .report-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 100%;
        }

        .col-name { width: 14%; min-width: 130px; }
        .col-folder { width: 12%; min-width: 120px; }
        .col-complexity { width: 8%; min-width: 80px; }
        .col-id { width: 6%; min-width: 60px; }
        .col-provider { width: 8%; min-width: 90px; }
        .col-dims { width: 10%; min-width: 90px; }
        .col-measures { width: 10%; min-width: 90px; }
        .col-vars { width: 10%; min-width: 90px; }
        .col-formulas { width: 14%; min-width: 150px; }
        .col-filters { width: 10%; min-width: 100px; }
        .col-visualizations { width: 8%; min-width: 90px; }
        .col-sql { width: 8%; min-width: 90px; }
        .col-actions { width: 8%; min-width: 90px; text-align: center; }

        .pill-high {
            background-color: #FEE2E2 !important;
            color: #991B1B !important;
            border-color: #FCA5A5 !important;
            font-weight: bold;
        }

        .pill-medium {
            background-color: #FEF3C7 !important;
            color: #92400E !important;
            border-color: #FDE68A !important;
            font-weight: bold;
        }

        .pill-low {
            background-color: #D1FAE5 !important;
            color: #065F46 !important;
            border-color: #A7F3D0 !important;
            font-weight: bold;
        }

        .report-table th {
            text-align: left;
            background-color: #ECEFF3;
            color: var(--navy);
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 12px 18px;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }

        .report-row {
            border-bottom: 1px solid var(--border);
            transition: background 0.15s ease;
        }

        .report-row:hover {
            background-color: #F1F5F9;
        }

        .report-row td {
            padding: 14px 18px;
            vertical-align: middle;
            font-size: 13.5px;
        }

        .report-name-cell {
            font-weight: 600;
            color: var(--navy);
        }

        .report-id-cell {
            font-family: monospace;
            font-size: 12px;
            color: var(--muted);
        }

        .pills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .pill-tag {
            font-size: 11px;
            font-weight: 500;
            padding: 3px 8px;
            border-radius: 6px;
            background: #E2E8F0;
            color: #334155;
            border: 1px solid #CBD5E1;
            white-space: nowrap;
        }

        .pill-dim {
            background: #EFF6FF;
            color: #1D4ED8;
            border-color: #BFDBFE;
        }

        .pill-measure {
            background: #F0FDF4;
            color: #15803D;
            border-color: #BBF7D0;
        }

        .pill-var {
            background: #FAF5FF;
            color: #7E22CE;
            border-color: #E9D5FF;
        }

        .pill-filter {
            background: #FFF7ED;
            color: #C2410C;
            border-color: #FED7AA;
        }

        .pill-more {
            cursor: pointer;
            background: #F1F5F9;
            color: var(--muted);
            border: 1px dashed #CBD5E1;
            font-size: 10.5px;
            font-weight: 600;
        }

        .pill-more:hover {
            background: #E2E8F0;
            color: var(--text);
        }

        .btn-view-details {
            background: var(--blue-light);
            border: 1px solid #BFDBFE;
            color: var(--blue);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .btn-view-details:hover {
            background: var(--blue);
            color: #fff;
            border-color: var(--blue);
        }

        /* Detail Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(16, 32, 55, 0.45);
            backdrop-filter: blur(3px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: var(--card);
            border-radius: 14px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 800px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: modalFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #FAFBFD;
        }

        .modal-header h3 {
            font-family: 'Sora', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--navy);
            margin: 0;
        }

        .modal-close-btn {
            background: none;
            border: none;
            font-size: 18px;
            color: var(--muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
        }

        .modal-close-btn:hover {
            background: #E2E8F0;
            color: var(--text);
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .modal-section-title {
            font-size: 12.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .formula-block {
            background: #F8FAFC;
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            color: #334155;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>

<body>

    <div class="topbar">
        <div class="topbar-inner">
            <div>
                <h1>Reports Inventory</h1>
                <p>Browse BusinessObjects documents grouped folder by folder &bull; View details, dimensions, measures, variables and SQL</p>
            </div>
            <button class="back-btn" onclick="history.back()">← Back to Overview</button>
        </div>
    </div>

    <div class="toolbar">
        <div class="search-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="11" cy="11" r="7" />
                <path d="M21 21l-4.3-4.3" />
            </svg>
            <input type="text" id="searchInput" placeholder="Search by report name, ID, or folder…" oninput="handleSearch()">
        </div>
        <button class="refresh-btn" id="toggleAllBtn" onclick="toggleAllGroups()" style="background: #475569; border-color: #475569;">⊟ Collapse All</button>
        <button class="refresh-btn" id="refreshBtn" onclick="loadReports(true)">↻ Refresh All</button>
        <button class="refresh-btn" id="exportBtn" onclick="exportToExcel()" style="background: #10847a; border-color: #10847a;">⬇ Export to Excel</button>
    </div>

    <div class="container" id="mainContainer">
        <div class="loading-state">
            <div class="spinner"></div>
            <p id="loadingMessage">Loading reports inventory & metadata...</p>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detailModal" onclick="if(event.target===this) closeDetailModal()">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalReportTitle">Report Details</h3>
                <button class="modal-close-btn" onclick="closeDetailModal()">✕</button>
            </div>
            <div class="modal-body" id="modalBody">
            </div>
        </div>
    </div>

    <script>
        let reportGroups = {};
        let activeSearch = "";
        let reportsById = {};
        let allExpanded = true;

        async function init() {
            await loadReports();
        }

        async function loadReports(forceRefresh = false) {
            const container = document.getElementById("mainContainer");
            container.innerHTML = `
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p id="loadingMessage">Loading report details & metadata...</p>
                </div>
            `;

            try {
                const url = forceRefresh ? "/api/reports/list?force=true" : "/api/reports/list";
                const res = await fetch(url);
                if (!res.ok) {
                    throw new Error(`Server returned ${res.status}`);
                }
                reportGroups = await res.json();
                renderUI();
            } catch (err) {
                console.error(err);
                container.innerHTML = `
                    <div class="status-banner">
                        <span>Error loading reports: ${err.message}</span>
                        <a href="javascript:void(0)" onclick="loadReports(true)" style="color: inherit; font-weight: bold; text-decoration: underline;">Retry</a>
                    </div>
                `;
            }
        }

        function toggleGroup(groupId) {
            const item = document.getElementById(`group-${groupId}`);
            if (item) {
                item.classList.toggle("expanded");
            }
        }

        function toggleAllGroups() {
            allExpanded = !allExpanded;
            const items = document.querySelectorAll(".accordion-item");
            items.forEach(item => {
                if (allExpanded) {
                    item.classList.add("expanded");
                } else {
                    item.classList.remove("expanded");
                }
            });
            const btn = document.getElementById("toggleAllBtn");
            if (btn) btn.textContent = allExpanded ? "⊟ Collapse All" : "⊞ Expand All";
        }

        function handleSearch() {
            activeSearch = document.getElementById("searchInput").value.trim().toLowerCase();
            renderUI();
        }

        function getComplexity(r) {
            const variables = r.variables || r.Variables || {};
            const varNames = Object.keys(variables);
            const varFormulas = Object.values(variables);
            const varCount = varNames.length;

            const hasComplexFunc = varFormulas.some(formula => {
                if (!formula) return false;
                const lower = formula.toLowerCase();
                return lower.includes("foreach") || lower.includes("forall");
            });

            if (varCount >= 10 || (varCount >= 5 && hasComplexFunc)) {
                return "High";
            } else if (varCount >= 5) {
                return "Medium";
            } else {
                return "Low";
            }
        }

        function cleanHex(str) {
            if (!str) return "";
            return String(str).replace(/_x([0-9a-fA-F]{4})_/g, (_, hex) => String.fromCharCode(parseInt(hex, 16)));
        }

        function parseList(val) {
            if (!val) return [];
            if (Array.isArray(val)) {
                return val.map(v => cleanHex(v)).filter(Boolean);
            }
            const cleanStr = cleanHex(val);
            return cleanStr.split(/,\s*/).map(s => s.trim()).filter(Boolean);
        }

        function renderPills(data, pillClass, maxVisible = 3) {
            const items = parseList(data);
            if (items.length === 0) return '<span style="color:var(--muted); font-size:12px;">—</span>';

            const visibleItems = items.slice(0, maxVisible);
            const hiddenItems = items.slice(maxVisible);

            let html = `<div class="pills-container">`;
            visibleItems.forEach(item => {
                html += `<span class="pill-tag ${pillClass}">${esc(item)}</span>`;
            });

            if (hiddenItems.length > 0) {
                const uid = 'more-' + Math.random().toString(36).substr(2, 9);
                html += `<span class="pill-tag pill-more" id="${uid}-btn" onclick="toggleMorePills('${uid}', event)">+${hiddenItems.length} more</span>`;
                html += `<span id="${uid}-extra" style="display:none;" class="pills-container">`;
                hiddenItems.forEach(item => {
                    html += `<span class="pill-tag ${pillClass}">${esc(item)}</span>`;
                });
                html += `</span>`;
            }
            html += `</div>`;
            return html;
        }

        function toggleMorePills(uid, event) {
            if (event) event.stopPropagation();
            const extra = document.getElementById(uid + '-extra');
            const btn = document.getElementById(uid + '-btn');
            if (extra) {
                const isHidden = extra.style.display === "none";
                extra.style.display = isHidden ? "inline-flex" : "none";
                if (btn) btn.style.display = isHidden ? "none" : "inline-block";
            }
        }

        function renderFormulas(formulas) {
            if (!formulas || formulas.length === 0) return '<span style="color:var(--muted); font-size:12px;">—</span>';
            const cleanFormulas = formulas.filter(Boolean);
            if (cleanFormulas.length === 0) return '<span style="color:var(--muted); font-size:12px;">—</span>';

            const first = cleanHex(cleanFormulas[0]);
            let html = `<div class="formula-block">${esc(first)}</div>`;

            if (cleanFormulas.length > 1) {
                const uid = 'form-' + Math.random().toString(36).substr(2, 9);
                html += `<span class="pill-tag pill-more" style="margin-top:4px;" id="${uid}-btn" onclick="toggleMorePills('${uid}', event)">+${cleanFormulas.length - 1} more formulas</span>`;
                html += `<div id="${uid}-extra" style="display:none; margin-top:4px; flex-direction:column; gap:4px;">`;
                cleanFormulas.slice(1).forEach(f => {
                    html += `<div class="formula-block">${esc(cleanHex(f))}</div>`;
                });
                html += `</div>`;
            }
            return html;
        }

        function renderVisualizations(visData, plainText = false) {
            if (!visData || Object.keys(visData).length === 0) {
                return plainText ? "—" : '<span style="color:var(--muted); font-size:12px;">—</span>';
            }

            let parts = [];
            for (const [tab, counts] of Object.entries(visData)) {
                const v = counts.visualizations || 0;
                const t = counts.tables || 0;
                parts.push(`${tab}: ${v} charts, ${t} tables`);
            }

            if (plainText) return parts.join(" | ");

            return `
                <div style="font-size:12px; color:var(--text);">
                    ${parts.map(p => `<div>${esc(p)}</div>`).join("")}
                </div>
            `;
        }

        function renderSQL(sqlQueries) {
            if (!sqlQueries || sqlQueries.length === 0) return '<span style="color:var(--muted); font-size:12px;">—</span>';
            const first = sqlQueries[0];
            let html = `<div class="formula-block" style="max-height:60px; overflow-y:auto;">${esc(first)}</div>`;

            if (sqlQueries.length > 1) {
                const uid = 'sql-' + Math.random().toString(36).substr(2, 9);
                html += `<span class="pill-tag pill-more" style="margin-top:4px;" id="${uid}-btn" onclick="toggleMorePills('${uid}', event)">+${sqlQueries.length - 1} more queries</span>`;
                html += `<div id="${uid}-extra" style="display:none; margin-top:4px; flex-direction:column; gap:4px;">`;
                sqlQueries.slice(1).forEach(q => {
                    html += `<div class="formula-block" style="max-height:80px; overflow-y:auto;">${esc(q)}</div>`;
                });
                html += `</div>`;
            }
            return html;
        }

        function openDetailModal(reportId) {
            const r = reportsById[reportId];
            if (!r) return;

            const modal = document.getElementById("detailModal");
            const rName = cleanHex(r.name || r.Name || r["Report Name"] || "Unnamed Report");
            document.getElementById("modalReportTitle").textContent = `${rName} (ID ${r.id || r.ID || "—"})`;

            const dims = r.dimensions || r.Dimensions || [];
            const measures = r.measures || r.Measures || [];
            const filters = r.filters || r.Filters || [];
            const dataproviders = r.dataproviders || r.Dataproviders || [];
            const variables = r.variables || r.Variables || {};

            const body = document.getElementById("modalBody");
            body.innerHTML = `
                <div class="modal-section">
                    <div class="modal-section-title">Folder Path</div>
                    <div style="font-size: 13.5px; font-weight: 500; color: var(--navy); word-break: break-all;">${esc(r.folder_path || "—")}</div>
                </div>
                <div class="modal-section">
                    <div class="modal-section-title">Data Provider Type</div>
                    ${renderPills(dataproviders, "pill-tag", 100)}
                </div>
                <div class="modal-section">
                    <div class="modal-section-title">Dimensions (${dims.length})</div>
                    ${renderPills(dims, "pill-dim", 100)}
                </div>
                <div class="modal-section">
                    <div class="modal-section-title">Measures (${measures.length})</div>
                    ${renderPills(measures, "pill-measure", 100)}
                </div>
                <div class="modal-section">
                    <div class="modal-section-title">Variables (${Object.keys(variables).length})</div>
                    <div class="variables-list" style="margin-top: 8px;">
                        ${Object.keys(variables).length === 0 ? '<span style="color:var(--muted); font-size:12px;">—</span>' : 
                          Object.entries(variables).map(([name, formula]) => `
                            <div style="margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed #E2E8F0;">
                                <div style="display:flex; justify-content:space-between; align-items:center;">
                                    <span class="pill-tag pill-var" style="font-weight:600;">${esc(name)}</span>
                                </div>
                                <div class="formula-block" style="margin-top: 4px;">${esc(formula || "—")}</div>
                            </div>
                          `).join("")}
                    </div>
                </div>
                <div class="modal-section">
                    <div class="modal-section-title">Filters (${filters.length})</div>
                    ${renderPills(filters, "pill-filter", 100)}
                </div>
                <div class="modal-section">
                    <div class="modal-section-title">Visualizations</div>
                    ${renderVisualizations(r.visualizations, false)}
                </div>
                <div class="modal-section">
                    <div class="modal-section-title">SQL Queries (${(r.sql || []).length})</div>
                    ${(r.sql || []).length === 0 ? '<span style="color:var(--muted); font-size:12px;">—</span>' : 
                      (r.sql || []).map(query => `
                        <div class="formula-block" style="margin-top: 6px; font-family: monospace; white-space: pre-wrap; word-break: break-all; max-height: 120px; overflow-y: auto;">${esc(query)}</div>
                      `).join("")}
                </div>
            `;

            modal.classList.add("active");
        }

        function closeDetailModal() {
            document.getElementById("detailModal").classList.remove("active");
        }

        function renderUI() {
            const container = document.getElementById("mainContainer");
            const groupKeys = Object.keys(reportGroups).filter(k => k !== "_collection_meta" && Array.isArray(reportGroups[k]));

            if (groupKeys.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="4" width="18" height="16" rx="2"/>
                            <path d="M9 9h6M9 13h6"/>
                        </svg>
                        <h3>Reports Inventory</h3>
                        <p>No report details found.</p>
                    </div>
                `;
                return;
            }

            let html = "";
            let totalRenderedGroups = 0;
            reportsById = {};

            const q = activeSearch;

            for (const key of groupKeys) {
                const reports = reportGroups[key] || [];

                const filtered = reports.filter(r => {
                    if (!q) return true;
                    const name = cleanHex(r.name || r.Name || r["Report Name"] || "").toLowerCase();
                    const id = String(r.id || r.ID || r["Report ID"] || "").toLowerCase();
                    const folder = (r.folder_path || key).toLowerCase();
                    return name.includes(q) || id.includes(q) || folder.includes(q);
                });

                if (filtered.length === 0) continue;
                totalRenderedGroups++;

                filtered.forEach(r => {
                    const rid = r.id || r.ID || r["Report ID"];
                    if (rid) reportsById[rid] = r;
                });

                const safeKeyId = key.replace(/[^a-zA-Z0-9_-]/g, "_");
                const isExpanded = allExpanded || (q !== "");
                const expandedClass = isExpanded ? "expanded" : "";

                html += `
                    <div class="accordion-item ${expandedClass}" id="group-${safeKeyId}">
                        <div class="accordion-header" onclick="toggleGroup('${safeKeyId}')">
                            <span class="accordion-title">
                                <span>📁 ${esc(key)}</span>
                                <span class="count-badge">${filtered.length} reports</span>
                            </span>
                            <div class="folder-header-actions" onclick="event.stopPropagation()">
                                <button class="btn-folder-export" onclick="exportSingleFolder('${esc(key)}', event)" title="Export only this folder to Excel">
                                    ⬇ Export Folder
                                </button>
                                <button class="btn-folder-refresh" onclick="refreshFolder('${esc(key)}', event)" title="Re-evaluate this folder">
                                    ↻ Refresh
                                </button>
                                <span class="chevron" onclick="toggleGroup('${safeKeyId}')">▼</span>
                            </div>
                        </div>
                        <div class="accordion-content">
                            <div class="table-scroll-wrapper">
                                <table class="report-table">
                                    <thead>
                                        <tr>
                                            <th class="col-name">Report Name</th>
                                            <th class="col-folder">Folder Path</th>
                                            <th class="col-complexity">Complexity</th>
                                            <th class="col-id">Report ID</th>
                                            <th class="col-provider">Data Provider</th>
                                            <th class="col-dims">Dimensions</th>
                                            <th class="col-measures">Measures</th>
                                            <th class="col-vars">Variables</th>
                                            <th class="col-formulas">Variable Definitions</th>
                                            <th class="col-filters">Filters</th>
                                            <th class="col-visualizations">Visualizations</th>
                                            <th class="col-sql">SQL Queries</th>
                                            <th class="col-actions">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${filtered.map(r => {
                                            const rName = cleanHex(r.name || r.Name || r["Report Name"] || "Unnamed Report");
                                            const rId = r.id || r.ID || r["Report ID"] || "—";
                                            const dims = r.dimensions || r.Dimensions || [];
                                            const measures = r.measures || r.Measures || [];
                                            const filters = r.filters || r.Filters || [];
                                            const dataproviders = r.dataproviders || r.Dataproviders || [];
                                            const variables = r.variables || r.Variables || {};
                                            const varNames = Object.keys(variables);
                                            const varFormulas = Object.values(variables);
                                            const complexity = getComplexity(r);

                                            return `
                                                <tr class="report-row">
                                                    <td class="report-name-cell col-name">${esc(rName)}</td>
                                                    <td class="col-folder" style="font-size:12.5px; color:var(--muted); word-break:break-all;">${esc(r.folder_path || key || "—")}</td>
                                                    <td class="col-complexity"><span class="pill-tag pill-${complexity.toLowerCase()}">${esc(complexity)}</span></td>
                                                    <td class="report-id-cell col-id">${esc(rId)}</td>
                                                    <td class="col-provider">${renderPills(dataproviders, "pill-tag", 2)}</td>
                                                    <td class="col-dims">${renderPills(dims, "pill-dim", 3)}</td>
                                                    <td class="col-measures">${renderPills(measures, "pill-measure", 3)}</td>
                                                    <td class="col-vars">${renderPills(varNames, "pill-var", 3)}</td>
                                                    <td class="col-formulas">${renderFormulas(varFormulas)}</td>
                                                    <td class="col-filters">${renderPills(filters, "pill-filter", 3)}</td>
                                                    <td class="col-visualizations">${renderVisualizations(r.visualizations)}</td>
                                                    <td class="col-sql">${renderSQL(r.sql)}</td>
                                                    <td class="col-actions">
                                                        <button class="btn-view-details" onclick="openDetailModal('${esc(rId)}')">🔍 Details</button>
                                                    </td>
                                                </tr>
                                            `;
                                        }).join("")}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            }

            if (totalRenderedGroups === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No reports found</h3>
                        <p>${q ? 'No reports match your search query.' : 'There are no reports loaded in the environment yet.'}</p>
                    </div>
                `;
            } else {
                container.innerHTML = html;
            }
        }

        function esc(str) {
            const div = document.createElement("div");
            div.textContent = (str === undefined || str === null) ? "" : str;
            return div.innerHTML;
        }

        // ============================================
        // EXPORT & REFRESH LOGIC
        // ============================================

        function exportSingleFolder(folderPath, event) {
            if (event) event.stopPropagation();
            const reports = reportGroups[folderPath];
            if (!reports || reports.length === 0) {
                alert(`No reports in folder "${folderPath}" to export.`);
                return;
            }
            const safeName = folderPath.replace(/[^a-zA-Z0-9_-]/g, "_").replace(/^_+|_+$/g, "") || "Root";
            downloadExcelForReports({ [folderPath]: reports }, `BOBJ_${safeName}_Reports.xls`);
        }

        async function refreshFolder(folderPath, event) {
            if (event) event.stopPropagation();
            const safeId = folderPath.replace(/[^a-zA-Z0-9_-]/g, "_");
            const btn = event?.currentTarget;
            const origText = btn ? btn.innerHTML : "";
            if (btn) btn.innerHTML = "⏳ Evaluating...";

            try {
                const url = `/api/reports/list?folder_path=${encodeURIComponent(folderPath)}&force=true`;
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (data[folderPath]) {
                    reportGroups[folderPath] = data[folderPath];
                    renderUI();
                }
            } catch (err) {
                alert(`Failed to refresh folder ${folderPath}: ${err.message}`);
            } finally {
                if (btn) btn.innerHTML = origText;
            }
        }

        function exportToExcel() {
            const groupKeys = Object.keys(reportGroups).filter(k => k !== "_collection_meta" && Array.isArray(reportGroups[k]));
            if (groupKeys.length === 0) {
                alert("No reports available to export.");
                return;
            }
            downloadExcelForReports(reportGroups, "BOBJ_Report_Inventory.xls");
        }

        function downloadExcelForReports(groupsMap, filename) {
            let html = `
            <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
            <head>
                <meta charset="utf-8">
                <!--[if gte mso 9]>
                <xml>
                    <x:ExcelWorkbook>
                        <x:ExcelWorksheets>
                            <x:ExcelWorksheet>
                                <x:Name>Report Inventory</x:Name>
                                <x:WorksheetOptions>
                                    <x:DisplayGridlines/>
                                </x:WorksheetOptions>
                            </x:ExcelWorksheet>
                        </x:ExcelWorksheets>
                    </x:ExcelWorkbook>
                </xml>
                <![endif]-->
                <style>
                    table { border-collapse: collapse; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; width: 100%; }
                    th { background-color: #16324F; color: #ffffff; font-weight: bold; border: 1px solid #CBD5E1; padding: 10px; text-align: left; }
                    td { border: 1px solid #CBD5E1; padding: 8px; vertical-align: top; font-size: 13px; color: #334155; }
                    tr:nth-child(even) td { background-color: #F8FAFC; }
                    .report-name { font-weight: bold; color: #0F172A; }
                </style>
            </head>
            <body>
                <table>
                    <thead>
                        <tr>
                            <th>Folder / Group</th>
                            <th>Report Name</th>
                            <th>Folder Path</th>
                            <th>Complexity</th>
                            <th>Report ID</th>
                            <th>Data Provider</th>
                            <th>Dimensions</th>
                            <th>Measures</th>
                            <th>Variables</th>
                            <th>Variable Definitions</th>
                            <th>Filters</th>
                            <th>Visualizations</th>
                            <th>SQL Queries</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            for (const [groupName, reports] of Object.entries(groupsMap)) {
                if (groupName === "_collection_meta" || !Array.isArray(reports)) continue;
                reports.forEach(r => {
                    const name = cleanHex(r.name || r.Name || r["Report Name"] || "Unnamed Report");
                    const id = r.id || r.ID || r["Report ID"] || "";
                    const dataproviders = parseList(r.dataproviders || r.Dataproviders).join(", ");
                    const dims = parseList(r.dimensions || r.Dimensions).join(", ");
                    const measures = parseList(r.measures || r.Measures).join(", ");
                    const variables = r.variables || r.Variables || {};
                    const varNames = Object.keys(variables).join(", ");
                    const varFormulas = Object.values(variables).join(", ");
                    const filters = parseList(r.filters || r.Filters).join(" | ");
                    const visualizations = renderVisualizations(r.visualizations || r.Visualizations, true);
                    const sqlQueries = parseList(r.sql || r.SQL).join(" \n\n ");
                    const complexity = getComplexity(r);

                    html += `
                        <tr>
                            <td>${esc(groupName)}</td>
                            <td class="report-name">${esc(name)}</td>
                            <td>${esc(r.folder_path || groupName || "—")}</td>
                            <td>${esc(complexity)}</td>
                            <td>${esc(id)}</td>
                            <td>${esc(dataproviders || "—")}</td>
                            <td>${esc(dims || "—")}</td>
                            <td>${esc(measures || "—")}</td>
                            <td>${esc(varNames || "—")}</td>
                            <td>${esc(varFormulas || "—")}</td>
                            <td>${esc(filters || "—")}</td>
                            <td>${esc(visualizations || "—")}</td>
                            <td>${esc(sqlQueries || "—")}</td>
                        </tr>
                    `;
                });
            }

            html += `
                    </tbody>
                </table>
            </body>
            </html>
            `;

            const blob = new Blob([html], { type: "application/vnd.ms-excel;charset=utf-8;" });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", filename);
            link.style.visibility = "hidden";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        init();
    </script>
</body>

</html>
